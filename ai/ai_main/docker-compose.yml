# 개발/시연용 단일 노드 구성: nori 포함 OpenSearch + AI 서비스.
# 15GB RAM 인스턴스 기준. OpenSearch 힙 2GB 로 잡아도 여유롭다.
services:
  opensearch:
    # 이미지는 docker load 또는 서버에서 직접 빌드해 올린다(배포 서버에는 소스가 없어
    # compose 가 빌드할 수 없다). 레시피는 opensearch.Dockerfile 에 있다:
    #   docker build -t ai-opensearch-nori:latest -f opensearch.Dockerfile .
    image: ai-opensearch-nori:latest
    restart: unless-stopped
    environment:
      - TZ=Asia/Seoul
      - discovery.type=single-node
      # 보안 플러그인 활성화(HTTPS + 인증). 비밀번호는 .env 에서 주입되어
      # 이 파일에는 남지 않는다. 2.12+ 는 대소문자·숫자·특수문자 포함을 요구한다.
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      - OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g
      - bootstrap.memory_lock=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      # 9200 을 외부에 열지 않는다. 같은 호스트의 FastAPI 만 접근.
      - "127.0.0.1:9200:9200"

  ai-service:
    image: ai-main:latest              # Jenkins 'AI Build' 단계에서 이 태그로 빌드됨
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Asia/Seoul
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
    # 로컬(SSH 터널)에서 S3_ENDPOINT=http://host.docker.internal:9000 을 쓰기 위해 남겨둔다.
    # 서버에서는 infra_default 네트워크로 MinIO 에 직접 붙으므로 쓰이지 않는다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      # default          : opensearch 와 통신
      # infra_default    : MinIO(S3_ENDPOINT=http://minio:9000).
      #                    MinIO 는 호스트의 127.0.0.1:9000 에만 바인딩돼 있어서
      #                    host-gateway 로는 닿지 않는다. 같은 네트워크에 붙어야 한다.
      # shared-web       : nginx 가 /ai/ 를 이 컨테이너로 프록시하기 위해 필요
      - default
      - infra_default
      - shared-web
    depends_on:
      - opensearch
    ports:
      # 통합 테스트 기간 동안 평문 :8000 을 외부에 열어 둔다.
      # 앱의 정규 경로는 nginx 경유 https(https://i15d207.p.ssafy.io/api/v1/...)다.
      # nginx 는 shared-web 네트워크로 ai-service:8000 에 직접 닿으므로 이 매핑과 무관하다.
      #
      # 테스트가 끝나면 "127.0.0.1:8000:8000" 으로 되돌려 외부 노출을 닫을 것.
      # APP_API_AUTH=false 라 이 포트는 토큰 없이 열려 있는 상태다.
      - "8000:8000"

# infra 프로젝트(nginx·MinIO)가 먼저 떠 있어야 한다. 이 compose 가 만들지 않는다.
networks:
  infra_default:
    external: true
  shared-web:
    external: true

volumes:
  opensearch-data:
