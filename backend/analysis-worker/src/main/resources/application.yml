spring:
  application:
    name: modera-analysis-worker

  profiles:
    default: local

  main:
    web-application-type: none

  # [Modern Java] Virtual Threads (Project Loom)
  threads:
    virtual:
      enabled: true

  # [Lifecycle] 종료 시 진행 중인 작업을 기다리는 유예 시간
  lifecycle:
    timeout-per-shutdown-phase: 30s

  jackson:
    time-zone: Asia/Seoul
    default-property-inclusion: always

# [Analysis] mock | fastapi. local 기본은 mock(AI 서버 없이 파이프라인 검증용).
analysis:
  client: mock
