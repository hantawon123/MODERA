spring:
  config:
    activate:
      on-profile: docker

  # [Data Source] local-infra의 analysis-worker 컨테이너에서 컨테이너 네트워크로 접속.
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:analysis-db}:${DB_PORT:5432}/${DB_NAME:modera_analysis}
    username: ${DB_USERNAME:analysis_admin}
    password: ${DB_PASSWORD:localdev}

    hikari:
      pool-name: modera-analysis-hikari-docker
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        highlight_sql: true

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# [Analysis] 컨테이너 환경에서도 실제 AI 서버가 없으니 기본은 mock.
analysis:
  client: ${ANALYSIS_CLIENT:mock}

logging:
  level:
    root: INFO
    com.ssafy.modera: DEBUG
