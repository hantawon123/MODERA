spring:
  application:
    name: modera

  profiles:
    # ?? ??? ?? ? ????? local ????? ????? ?? ??? ??
    default: local

  # [Modern Java] Virtual Threads (Project Loom)
  threads:
    virtual:
      enabled: true

  # [Lifecycle] ?? ? ???? ?? ??? ?? ??
  lifecycle:
    timeout-per-shutdown-phase: 30s

  # [JSON] ?? ?? ?? ???
  jackson:
    time-zone: Asia/Seoul
    default-property-inclusion: non_null # null? ??? ???? ???? ???? ??

  # [Data] ???? JPA ?? (?? ???? ??)
  jpa:
    open-in-view: false # [Critical] OSIV? ?? ??? ??? ??? ????? ??? ???.
    properties:
      hibernate:
        # ?? ????? ???? ? padding? ?? SQL Re-compilation ?? (?? ???)
        query.in_clause_parameter_padding: true

server:
  shutdown: graceful
  port: 8080
  forward-headers-strategy: native # L4/Gateway? ??(X-Forwarded-For)? ???? ??

# [Security] JWT 설정. 모든 환경에서 JWT_SECRET 환경변수 주입 필수 (fallback 없음 — 미주입 시 기동 실패).
# 시크릿을 저장소에 절대 커밋하지 않는다. 로컬은 .env / IDE 환경변수로 주입할 것.
jwt:
  secret: ${JWT_SECRET}
  access-token-validity-in-seconds: 1800
  refresh-token-validity-in-seconds: 1209600

# [Observability] ???? ?? ??
management:
  endpoints:
    web:
      exposure:
        # ?? ????? ? ??????? ??? ???(VPN) ????? ?? ???? ???? ?
        include: "health, info, prometheus, metrics"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true # Liveness, Readiness ??? ?? ???
    metrics:
      enabled: true
    prometheus:
      enabled: true

  # [Metrics] Micrometer ??
  metrics:
    tags:
      application: ${spring.application.name} # ?? ???? ?????? ?? ??
