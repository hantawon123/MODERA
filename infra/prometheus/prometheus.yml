# Prometheus는 아래 타겟들의 /actuator/prometheus를 주기적으로 긁어(scrape) 시계열로 쌓는다.
# 타겟 주소가 컨테이너 이름인 이유: 같은 infra_default 네트워크라 DNS로 찾아간다.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: modera-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["modera-api:9080"]     # 관리 전용 포트 (호스트 미노출)

  - job_name: modera-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["modera-worker:8081"]

  # Redis 자체는 Prometheus 형식을 모른다. redis_exporter가 INFO 명령 결과를
  # 번역해 /metrics(기본 경로)로 노출한다 — 그래서 metrics_path를 쓰지 않는다.
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # 서버(호스트) 자체 지표. 디스크·메모리·네트워크.
  # 이미지 영구 보관 정책이라 디스크 사용률이 특히 중요하다.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # FastAPI AI 서비스. prometheus-fastapi-instrumentator 가 /metrics(기본 경로)로
  # 핸들러별 요청 수·지연시간을 노출한다. 같은 infra_default 네트워크라 이름으로 닿는다.
  - job_name: ai-service
    static_configs:
      - targets: ["ai-service:8000"]
