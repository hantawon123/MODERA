auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 24h         # 하루. 로그 조회는 대부분 "방금 무슨 일이 났나"라
                                # 장기 보존 가치가 낮은데 증가 속도는 빠르다(1MB/분).

compactor:
  working_directory: /loki/compactor
  retention_enabled: true       # 이게 없으면 retention_period가 무시된다
  delete_request_store: filesystem
