spring:
  config:
    activate:
      on-profile: local

  # [Data Source] 로컬 개발용 PostgreSQL.
  # 서버 PostgreSQL 로 SSH 터널을 뚫고 localhost:5432 로 붙는 전제.
  #   예) ssh -N -L 5432:localhost:5432 <user>@<server>
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:modera}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD} # 하드코딩 금지. 환경변수 미주입 시 기동 실패(fail-fast)

    hikari:
      pool-name: modera-hikari-local
      maximum-pool-size: 10 # ??? 10?? ??
      minimum-idle: 2
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000

  # [JPA & Hibernate]
  jpa:
    hibernate:
      # ?? ?? ??? validate?? update? ???? ???, 
      # ?????? ?(Flyway/Liquibase)? ??? validate ??.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        highlight_sql: true # ?? SQL? ??? ?? ??? ??
        # [Performance] Batch Insert/Update ???
        jdbc.batch_size: 20
        order_inserts: true
        order_updates: true

  # [Redis]
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:} # ???? ?? ??? ??? ?? ??

  # [Modern Feature] Virtual Threads ??? (??!)
  threads:
    virtual:
      enabled: true

# [Object Storage] S3 호환 스토리지(MinIO). presigned URL 발급용.
# 자격증명은 하드코딩 금지 — 전부 환경변수로 주입.
storage:
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:modera}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    path-style-access: true # MinIO 는 path-style 필요

# [Logging] ??? ???? ?? ??
logging:
  level:
    root: INFO
    com.ssafy.modera: DEBUG
    # SQL ??? ?????? ?? ??? ?? ???? P6Spy ??
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.cache: TRACE # Redis ?? ???
