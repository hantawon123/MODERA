apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'

springBoot {
    mainClass = 'com.ssafy.modera.worker.AnalysisWorkerApplication'
}

bootJar {
    archiveFileName = 'analysis-worker.jar'
}

dependencies {
    implementation project(':event-contract')

    // web 스타터 없음 — Redis Streams 컨슈머로만 동작하는 백그라운드 프로세스
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // FastApiAnalysisClient가 AI 서버 HTTP 호출에 RestClient를 쓴다(전체 web 스타터는 필요 없음).
    implementation 'org.springframework:spring-web'

    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // JSONB/vector 바인딩에 org.postgresql.util.PGobject를 직접 쓰므로 컴파일 타임에도 필요하다.
    implementation 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
