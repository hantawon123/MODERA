spring:
  config:
    activate:
      on-profile: local

  # [Data Source] local-infra의 api-db 컨테이너.
  # 이 개발 환경에서는 다른 프로젝트 컨테이너가 host 5432를 이미 쓰고 있어
  # local-infra/docker-compose.yml에서 api-db를 host 5433으로 노출했다(3단계 참고).
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:modera_api}
    username: ${DB_USERNAME:api_admin}
    password: ${DB_PASSWORD:localdev}

    hikari:
      pool-name: modera-api-hikari-local
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000

  # [JPA & Hibernate]
  jpa:
    hibernate:
      # 스키마는 Liquibase가 소유. Hibernate는 검증만 한다.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        highlight_sql: true
        jdbc.batch_size: 20
        order_inserts: true
        order_updates: true

  # [Redis] local-infra의 redis 컨테이너. host 6379도 다른 프로젝트가 쓰고 있어 6380으로 노출했다.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}

  threads:
    virtual:
      enabled: true

# [Object Storage] local-infra의 minio 컨테이너. host 9000도 다른 프로젝트가 쓰고 있어 9002로 노출했다(3단계 참고).
# internal: 서버가 MinIO에 접근·서명할 때 / public: presigned URL을 클라이언트에 줄 때 호스트 치환용
storage:
  s3:
    internal-endpoint: ${S3_INTERNAL_ENDPOINT:http://localhost:9002}
    public-endpoint: ${S3_PUBLIC_ENDPOINT:http://localhost:9002}
    region: ${S3_REGION:us-east-1}
    bucket:
      pictures: ${S3_BUCKET_PICTURES:pictures}
      thumbnails: ${S3_BUCKET_THUMBNAILS:thumbnails}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    path-style-access: true

# [Internal] MinIO ObjectCreated webhook 인증 토큰
internal:
  storage:
    webhook-token: ${MINIO_WEBHOOK_TOKEN:local-dev-webhook-token}

logging:
  level:
    root: INFO
    com.ssafy.modera: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.cache: TRACE
