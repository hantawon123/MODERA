global:
  scrape_interval: 15s

scrape_configs:
  - job_name: modera-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["modera-api:9080"]

  - job_name: modera-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["modera-worker:8081"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: ai-service
    static_configs:
      - targets: ["ai-service:8000"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
