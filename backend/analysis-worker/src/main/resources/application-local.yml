spring:
  config:
    activate:
      on-profile: local

  # [Data Source] local-infra의 analysis-db 컨테이너.
  # 이 개발 환경은 host 5432가 이미 다른 프로젝트 컨테이너 차지라
  # local-infra/docker-compose.yml에서 analysis-db를 host 5434로 노출했다(3단계 참고).
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:modera_analysis}
    username: ${DB_USERNAME:analysis_admin}
    password: ${DB_PASSWORD:localdev}

    hikari:
      pool-name: modera-analysis-hikari-local
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      # 스키마는 Liquibase가 소유. Hibernate는 검증만 한다.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        highlight_sql: true

  # [Redis] local-infra의 redis 컨테이너. host 6379도 다른 프로젝트가 쓰고 있어 6380으로 노출했다.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}

logging:
  level:
    root: INFO
    com.ssafy.modera: DEBUG
