spring:
  config:
    activate:
      on-profile: docker

  # [Data Source] local-infra의 api-server 컨테이너에서 컨테이너 네트워크로 접속.
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:api-db}:${DB_PORT:5432}/${DB_NAME:modera_api}
    username: ${DB_USERNAME:api_admin}
    password: ${DB_PASSWORD:localdev}

    hikari:
      pool-name: modera-api-hikari-docker
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        highlight_sql: true
        jdbc.batch_size: 20
        order_inserts: true
        order_updates: true

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  threads:
    virtual:
      enabled: true

# internal: 컨테이너 네트워크의 minio로 접근·서명 / public: 호스트에 노출된 포트(3단계 참고)
storage:
  s3:
    internal-endpoint: ${S3_INTERNAL_ENDPOINT:http://minio:9000}
    public-endpoint: ${S3_PUBLIC_ENDPOINT:http://localhost:9002}
    region: ${S3_REGION:us-east-1}
    bucket:
      pictures: ${S3_BUCKET_PICTURES:pictures}
      thumbnails: ${S3_BUCKET_THUMBNAILS:thumbnails}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    path-style-access: true

# token은 worker의 internal.callback.token과 같은 값이어야 한다.
internal:
  storage:
    webhook-token: ${MINIO_WEBHOOK_TOKEN:local-dev-webhook-token}
  token: ${INTERNAL_TOKEN:local-dev-internal-token}

# [Worker] 컨테이너 네트워크의 worker. worker는 호스트에 포트를 노출하지 않는다.
worker:
  base-url: ${WORKER_BASE_URL:http://analysis-worker:8081}

# [AI] 문서 생성 동기 호출. 컨테이너 네트워크의 ai-server.
ai:
  base-url: ${AI_SERVER_URL:http://ai-server:8000}

logging:
  level:
    root: INFO
    com.ssafy.modera: DEBUG
