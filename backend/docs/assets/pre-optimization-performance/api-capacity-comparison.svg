<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">개선 전 API별 최대 안정 처리량 비교</title>
  <desc id="desc">응답시간 300밀리초 이내 부하 테스트와 30초 과부하 생존 테스트에서 확인한 API별 최대 안정 요청 수를 초당 요청 수로 비교한다.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 32px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif; fill: #172033; }
      .subtitle { font: 400 17px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif; fill: #667085; }
      .label { font: 600 18px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif; fill: #25324b; }
      .tick { font: 400 14px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif; fill: #667085; }
      .value { font: 700 16px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif; fill: #172033; }
      .legend { font: 500 15px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif; fill: #344054; }
      .note { font: 400 14px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif; fill: #667085; }
      .grid { stroke: #e4e7ec; stroke-width: 1; }
      .axis { stroke: #98a2b3; stroke-width: 1.4; }
      .load { fill: #3977e3; }
      .overload { fill: #18a999; }
      .cap { fill: #f2f4f7; }
    </style>
  </defs>
  <rect class="bg" width="1400" height="760"/>
  <text class="title" x="70" y="64">개선 전 API별 최대 안정 처리량</text>
  <text class="subtitle" x="70" y="98">부하: p95 ≤ 300ms · 오류율 &lt; 1% · dropped 0  |  과부하: 30초 부하 후 서버 생존 · health 100% · dropped 0</text>

  <rect class="load" x="820" y="126" width="22" height="15" rx="3"/>
  <text class="legend" x="852" y="139">부하 테스트 최대 통과 RPS</text>
  <rect class="overload" x="1080" y="126" width="22" height="15" rx="3"/>
  <text class="legend" x="1112" y="139">과부하 테스트 최대 생존 RPS</text>

  <line class="grid" x1="290" y1="165" x2="290" y2="650"/>
  <line class="grid" x1="440" y1="165" x2="440" y2="650"/>
  <line class="grid" x1="590" y1="165" x2="590" y2="650"/>
  <line class="grid" x1="740" y1="165" x2="740" y2="650"/>
  <line class="grid" x1="890" y1="165" x2="890" y2="650"/>
  <line class="grid" x1="1040" y1="165" x2="1040" y2="650"/>
  <line class="grid" x1="1190" y1="165" x2="1190" y2="650"/>
  <line class="axis" x1="290" y1="650" x2="1190" y2="650"/>
  <text class="tick" x="290" y="675" text-anchor="middle">0</text>
  <text class="tick" x="440" y="675" text-anchor="middle">500</text>
  <text class="tick" x="590" y="675" text-anchor="middle">1,000</text>
  <text class="tick" x="740" y="675" text-anchor="middle">1,500</text>
  <text class="tick" x="890" y="675" text-anchor="middle">2,000</text>
  <text class="tick" x="1040" y="675" text-anchor="middle">2,500</text>
  <text class="tick" x="1190" y="675" text-anchor="middle">3,000 RPS</text>

  <text class="label" x="270" y="213" text-anchor="end">사용자 조회</text>
  <rect class="cap" x="290" y="184" width="900" height="58" rx="6"/>
  <rect class="load" x="290" y="184" width="690" height="24" rx="5"/>
  <rect class="overload" x="290" y="218" width="900" height="24" rx="5"/>
  <text class="value" x="992" y="202">≥ 2,300</text>
  <text class="value" x="1202" y="236">3,000</text>

  <text class="label" x="270" y="309" text-anchor="end">카테고리 목록</text>
  <rect class="cap" x="290" y="280" width="900" height="58" rx="6"/>
  <rect class="load" x="290" y="280" width="750" height="24" rx="5"/>
  <rect class="overload" x="290" y="314" width="600" height="24" rx="5"/>
  <text class="value" x="1052" y="298">2,500</text>
  <text class="value" x="902" y="332">2,000</text>

  <text class="label" x="270" y="405" text-anchor="end">이미지 목록</text>
  <rect class="cap" x="290" y="376" width="900" height="58" rx="6"/>
  <rect class="load" x="290" y="376" width="60" height="24" rx="5"/>
  <rect class="overload" x="290" y="410" width="60" height="24" rx="5"/>
  <text class="value" x="362" y="394">200</text>
  <text class="value" x="362" y="428">200</text>

  <text class="label" x="270" y="501" text-anchor="end">스케줄 목록</text>
  <rect class="cap" x="290" y="472" width="900" height="58" rx="6"/>
  <rect class="load" x="290" y="472" width="720" height="24" rx="5"/>
  <rect class="overload" x="290" y="506" width="750" height="24" rx="5"/>
  <text class="value" x="1022" y="490">2,400</text>
  <text class="value" x="1052" y="524">2,500</text>

  <text class="label" x="270" y="597" text-anchor="end">문서 목록</text>
  <rect class="cap" x="290" y="568" width="900" height="58" rx="6"/>
  <rect class="load" x="290" y="568" width="780" height="24" rx="5"/>
  <rect class="overload" x="290" y="602" width="675" height="24" rx="5"/>
  <text class="value" x="1082" y="586">≥ 2,600</text>
  <text class="value" x="977" y="620">2,250</text>

  <text class="note" x="70" y="718">※ ≥ 표시는 해당 단계까지 통과했으나 더 높은 단계는 탐색하지 않아 정확한 최대치가 아니라 확인된 하한임.</text>
  <text class="note" x="70" y="742">※ 이미지 목록은 200 RPS에서 병목이 먼저 발생했으며, 다른 조회 API 대비 최대 안정 처리량이 약 8~15배 낮음.</text>
</svg>
